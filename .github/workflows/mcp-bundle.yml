name: MCP bundle is current

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mcp
      - name: Fail if mcp/server.mjs is stale
        run: git diff --exit-code mcp/server.mjs || (echo "Run npm run build:mcp and commit mcp/server.mjs" && exit 1)
